<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/excelenc.IA/">
  <script>
    // GitHub Pages publica este app em uma subpasta. Se um build manual usar
    // um base-href digitado incorretamente, corrige o caminho antes que o
    // navegador tente carregar manifest.json, flutter_bootstrap.js e assets.
    (() => {
      const base = document.querySelector('base');
      const pageDirectory = new URL('.', window.location.href);
      const configuredDirectory = new URL(base.href, window.location.href);
      if (
        configuredDirectory.origin !== pageDirectory.origin ||
        configuredDirectory.pathname !== pageDirectory.pathname
      ) {
        base.href = pageDirectory.pathname;
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Excelenc.IA — transforme tabelas digitalizadas em Excel pelo navegador.">
  <meta name="theme-color" content="#0A2342">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>Excelenc.IA</title>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background: #f5f7fa;
    }
  </style>
</head>
<body>
  <script>
    // Builds antigos do Flutter registravam um Service Worker. Remove apenas
    // registros deste projeto para impedir que um bundle Drift obsoleto seja
    // servido pelo cache depois de uma nova publicação no GitHub Pages.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        const projectBase = new URL(document.baseURI).href;
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(
          registrations
            .filter((registration) => registration.scope.startsWith(projectBase))
            .map((registration) => registration.unregister()),
        );
      });
    }
  </script>

  <!-- PDF.js exigido pelo pdfx. O arquivo selecionado permanece na memória local. -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs" type="module"></script>
  <script type="module">
    var { pdfjsLib } = globalThis;
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs";
    var pdfRenderOptions = {
      cMapUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/",
      cMapPacked: true,
    };
  </script>

  <!-- Tesseract.js executa OCR em Web Worker no próprio navegador. -->
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
  <script>
    function _clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function _escapeHocr(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function _loadOcrImage(source) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("Não foi possível preparar a imagem para OCR."));
        image.src = source;
      });
    }

    function _histogramPercentile(histogram, total, percentile) {
      const target = total * percentile;
      let accumulated = 0;
      for (let value = 0; value < histogram.length; value++) {
        accumulated += histogram[value];
        if (accumulated >= target) return value;
      }
      return 255;
    }

    function _otsuThreshold(histogram, total) {
      let weightedTotal = 0;
      for (let value = 0; value < 256; value++) {
        weightedTotal += value * histogram[value];
      }

      let backgroundWeight = 0;
      let backgroundSum = 0;
      let bestVariance = -1;
      let bestThreshold = 170;
      for (let value = 0; value < 256; value++) {
        backgroundWeight += histogram[value];
        if (backgroundWeight === 0) continue;
        const foregroundWeight = total - backgroundWeight;
        if (foregroundWeight === 0) break;
        backgroundSum += value * histogram[value];
        const backgroundMean = backgroundSum / backgroundWeight;
        const foregroundMean = (weightedTotal - backgroundSum) / foregroundWeight;
        const variance =
          backgroundWeight * foregroundWeight * (backgroundMean - foregroundMean) ** 2;
        if (variance > bestVariance) {
          bestVariance = variance;
          bestThreshold = value;
        }
      }
      return bestThreshold;
    }

    function _lineBands(scores, minimumScore, maximumThickness) {
      const bands = [];
      let index = 0;
      while (index < scores.length) {
        if (scores[index] < minimumScore) {
          index++;
          continue;
        }
        const start = index;
        let end = index;
        let weightedPosition = 0;
        let weight = 0;
        let toleratedGap = 0;
        while (index < scores.length) {
          if (scores[index] >= minimumScore) {
            end = index;
            weightedPosition += index * scores[index];
            weight += scores[index];
            toleratedGap = 0;
          } else if (toleratedGap < 1) {
            toleratedGap++;
          } else {
            break;
          }
          index++;
        }
        if (end - start + 1 <= maximumThickness && weight > 0) {
          bands.push({
            start,
            end,
            center: weightedPosition / weight,
            peak: Math.max(...scores.slice(start, end + 1)),
          });
        }
      }
      return bands;
    }

    function _collapseLineBands(bands, minimumSeparation) {
      const groups = [];
      for (const band of bands) {
        const group = groups.at(-1);
        if (!group || band.center - group.at(-1).center >= minimumSeparation) {
          groups.push([band]);
        } else {
          group.push(band);
        }
      }
      return groups.map((group) =>
        group.reduce((best, candidate) =>
          candidate.peak > best.peak ? candidate : best,
        ),
      );
    }

    function _maximumScore(scores) {
      let maximum = 0;
      for (const score of scores) maximum = Math.max(maximum, score);
      return maximum;
    }

    function _longestHorizontalDarkRun(
      gray,
      width,
      height,
      y,
      threshold,
      firstX = 0,
      lastX = width - 1,
    ) {
      let longest = 0;
      let run = 0;
      let toleratedGap = 0;
      const centerY = Math.round(y);
      for (let x = Math.max(0, firstX); x <= Math.min(width - 1, lastX); x++) {
        let dark = false;
        for (let offsetY = -1; offsetY <= 1; offsetY++) {
          const candidateY = centerY + offsetY;
          if (
            candidateY >= 0 &&
            candidateY < height &&
            gray[candidateY * width + x] <= threshold
          ) {
            dark = true;
            break;
          }
        }
        if (dark) {
          run += toleratedGap + 1;
          toleratedGap = 0;
          longest = Math.max(longest, run);
        } else if (run > 0 && toleratedGap < 2) {
          toleratedGap++;
        } else {
          run = 0;
          toleratedGap = 0;
        }
      }
      return longest;
    }

    function _longestVerticalDarkRun(
      gray,
      width,
      height,
      x,
      threshold,
      firstY = 0,
      lastY = height - 1,
    ) {
      let longest = 0;
      let run = 0;
      let toleratedGap = 0;
      const centerX = Math.round(x);
      for (let y = Math.max(0, firstY); y <= Math.min(height - 1, lastY); y++) {
        let dark = false;
        for (let offsetX = -1; offsetX <= 1; offsetX++) {
          const candidateX = centerX + offsetX;
          if (
            candidateX >= 0 &&
            candidateX < width &&
            gray[y * width + candidateX] <= threshold
          ) {
            dark = true;
            break;
          }
        }
        if (dark) {
          run += toleratedGap + 1;
          toleratedGap = 0;
          longest = Math.max(longest, run);
        } else if (run > 0 && toleratedGap < 2) {
          toleratedGap++;
        } else {
          run = 0;
          toleratedGap = 0;
        }
      }
      return longest;
    }

    function _lowerQuartile(values) {
      if (values.length === 0) return 0;
      const ordered = [...values].sort((a, b) => a - b);
      return ordered[Math.floor((ordered.length - 1) * 0.25)];
    }

    function _selectDenseLineSequence(bands, pageSize) {
      if (bands.length < 4) return bands;
      const gaps = [];
      for (let index = 0; index < bands.length - 1; index++) {
        gaps.push(bands[index + 1].center - bands[index].center);
      }
      const ordered = [...gaps].sort((a, b) => a - b);
      const middle = Math.floor(ordered.length / 2);
      const medianGap = ordered.length % 2
        ? ordered[middle]
        : (ordered[middle - 1] + ordered[middle]) / 2;
      const breakGap = Math.max(pageSize * 0.08, medianGap * 3.2);
      const groups = [[bands[0]]];
      for (let index = 1; index < bands.length; index++) {
        if (bands[index].center - bands[index - 1].center > breakGap) {
          groups.push([]);
        }
        groups.at(-1).push(bands[index]);
      }
      return groups.reduce((best, group) => {
        if (group.length !== best.length) return group.length > best.length ? group : best;
        const groupPeak = group.reduce((sum, band) => sum + band.peak, 0);
        const bestPeak = best.reduce((sum, band) => sum + band.peak, 0);
        return groupPeak > bestPeak ? group : best;
      });
    }

    function _gridIntersectionRatio(
      gray,
      width,
      height,
      horizontalLines,
      verticalLines,
      threshold,
    ) {
      const horizontalStep = Math.max(1, Math.ceil(horizontalLines.length / 60));
      const verticalStep = Math.max(1, Math.ceil(verticalLines.length / 40));
      let hits = 0;
      let total = 0;
      for (let row = 0; row < horizontalLines.length; row += horizontalStep) {
        const centerY = Math.round(horizontalLines[row]);
        for (let column = 0; column < verticalLines.length; column += verticalStep) {
          const centerX = Math.round(verticalLines[column]);
          total++;
          let found = false;
          for (let offsetY = -3; offsetY <= 3 && !found; offsetY++) {
            const y = centerY + offsetY;
            if (y < 0 || y >= height) continue;
            for (let offsetX = -3; offsetX <= 3; offsetX++) {
              const x = centerX + offsetX;
              if (x >= 0 && x < width && gray[y * width + x] <= threshold) {
                found = true;
                break;
              }
            }
          }
          if (found) hits++;
        }
      }
      return total === 0 ? 0 : hits / total;
    }

    function _isUsableGrid(gray, width, height, horizontalLines, verticalLines, threshold) {
      if (
        horizontalLines.length < 2 ||
        verticalLines.length < 2 ||
        horizontalLines.length > Math.floor(height / 3) + 1 ||
        verticalLines.length > Math.floor(width / 3) + 1
      ) {
        return false;
      }
      const horizontalSpan = horizontalLines.at(-1) - horizontalLines[0];
      const verticalSpan = verticalLines.at(-1) - verticalLines[0];
      if (
        horizontalSpan < Math.max(12, height * 0.02) ||
        verticalSpan < Math.max(12, width * 0.02)
      ) {
        return false;
      }

      const firstX = Math.round(verticalLines[0]);
      const lastX = Math.round(verticalLines.at(-1));
      const firstY = Math.round(horizontalLines[0]);
      const lastY = Math.round(horizontalLines.at(-1));
      const horizontalContinuity = _lowerQuartile(
        horizontalLines.map((line) =>
          _longestHorizontalDarkRun(
            gray,
            width,
            height,
            line,
            threshold,
            firstX,
            lastX,
          ) / Math.max(1, verticalSpan),
        ),
      );
      const verticalContinuity = _lowerQuartile(
        verticalLines.map((line) =>
          _longestVerticalDarkRun(
            gray,
            width,
            height,
            line,
            threshold,
            firstY,
            lastY,
          ) / Math.max(1, horizontalSpan),
        ),
      );
      const intersectionRatio = _gridIntersectionRatio(
        gray,
        width,
        height,
        horizontalLines,
        verticalLines,
        threshold,
      );
      return horizontalContinuity >= 0.48 &&
        verticalContinuity >= 0.34 &&
        intersectionRatio >= 0.40;
    }

    function _verticalBoundaryRatio(gray, width, height, x, top, bottom, threshold) {
      const firstY = Math.max(0, Math.ceil(top + 3));
      const lastY = Math.min(height - 1, Math.floor(bottom - 3));
      let hits = 0;
      let total = 0;
      for (let y = firstY; y <= lastY; y++) {
        total++;
        let found = false;
        for (let offsetX = -3; offsetX <= 3; offsetX++) {
          const candidateX = Math.round(x) + offsetX;
          if (
            candidateX >= 0 &&
            candidateX < width &&
            gray[y * width + candidateX] <= threshold
          ) {
            found = true;
            break;
          }
        }
        if (found) hits++;
      }
      return total === 0 ? 1 : hits / total;
    }

    function _detectRowSegments(gray, width, height, horizontalLines, verticalLines, threshold) {
      const rows = [];
      const columnCount = verticalLines.length - 1;
      for (let row = 0; row < horizontalLines.length - 1; row++) {
        const segments = [];
        let start = 0;
        for (let boundary = 1; boundary < verticalLines.length - 1; boundary++) {
          const boundaryRatio = _verticalBoundaryRatio(
            gray,
            width,
            height,
            verticalLines[boundary],
            horizontalLines[row],
            horizontalLines[row + 1],
            threshold,
          );
          if (boundaryRatio >= 0.28) {
            segments.push({ start, end: boundary - 1 });
            start = boundary;
          }
        }
        segments.push({ start, end: columnCount - 1 });
        rows.push(segments);
      }
      return rows;
    }

    function _segmentForCell(grid, row, column) {
      const segments = grid.rowSegments && grid.rowSegments[row];
      if (!segments) return { start: column, end: column };
      return segments.find((segment) =>
        column >= segment.start && column <= segment.end,
      ) || { start: column, end: column };
    }

    function _findNumericStartColumn(verticalLines) {
      const gaps = [];
      for (let index = 0; index < verticalLines.length - 1; index++) {
        gaps.push(verticalLines[index + 1] - verticalLines[index]);
      }
      const searchable = Math.max(1, Math.ceil(gaps.length * 0.65));
      let widestIndex = 0;
      for (let index = 1; index < searchable; index++) {
        if (gaps[index] > gaps[widestIndex]) widestIndex = index;
      }
      // Em fichas de medidas a coluna mais larga é a descrição. Quando existem
      // oito ou mais colunas, normalmente há ainda GRADUAÇÃO e PP antes de P.
      // O cabeçalho reconhecido refina esta estimativa mais adiante.
      const metadataColumns = verticalLines.length >= 9 ? 3 : 1;
      return _clamp(widestIndex + metadataColumns, 1, verticalLines.length - 2);
    }

    function _inferNumericStartColumn(words, grid) {
      const headerByColumn = new Map();
      for (const word of words) {
        const row = _cellIndex(grid.horizontalLines, (word.y0 + word.y1) / 2);
        const column = _cellIndex(grid.verticalLines, (word.x0 + word.x1) / 2);
        if (row !== 0 || column < 0) continue;
        const previous = headerByColumn.get(column) || "";
        headerByColumn.set(column, `${previous} ${word.text}`.trim().toUpperCase());
      }

      for (let column = 0; column < grid.verticalLines.length - 1; column++) {
        const label = (headerByColumn.get(column) || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^A-Z]/g, "");
        if (label === "P") return column;
        if (label === "PP") return Math.min(column + 1, grid.verticalLines.length - 2);
        if (/^(QTD|QTDE|QUANTIDADE|TOTAL|VALOR|PRECO|UNITARIO)$/.test(label)) {
          return column;
        }
      }
      return _findNumericStartColumn(grid.verticalLines);
    }

    function _cellIndex(lines, coordinate) {
      for (let index = 0; index < lines.length - 1; index++) {
        if (coordinate >= lines[index] && coordinate < lines[index + 1]) return index;
      }
      return -1;
    }

    async function _prepareTableForOcr(source) {
      const image = await _loadOcrImage(source);
      const canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth || image.width;
      canvas.height = image.naturalHeight || image.height;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(image, 0, 0, canvas.width, canvas.height);

      const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
      const gray = new Uint8Array(canvas.width * canvas.height);
      const histogram = new Uint32Array(256);
      for (let index = 0; index < gray.length; index++) {
        const offset = index * 4;
        const value = Math.round(
          pixels.data[offset] * 0.299 +
          pixels.data[offset + 1] * 0.587 +
          pixels.data[offset + 2] * 0.114,
        );
        gray[index] = value;
        histogram[value]++;
      }

      const low = _histogramPercentile(histogram, gray.length, 0.025);
      const high = Math.max(low + 25, _histogramPercentile(histogram, gray.length, 0.985));
      // A grade costuma ser cinza-clara em PDFs escaneados; um limiar um pouco
      // acima do Otsu detecta essas réguas sem transformar texto em linhas,
      // pois a validação abaixo exige um traço contínuo longo.
      const lineThreshold = _clamp(_otsuThreshold(histogram, gray.length) + 55, 160, 240);
      const horizontalScores = new Uint32Array(canvas.height);
      const verticalScores = new Uint32Array(canvas.width);

      // Mede o maior traço contínuo, tolerando pequenas falhas do escaneamento.
      // Somar todos os pixels escuros da faixa confundia linhas de texto com
      // bordas da tabela e criava grades falsas de 7 × 8 células.
      for (let y = 0; y < canvas.height; y++) {
        horizontalScores[y] = _longestHorizontalDarkRun(
          gray,
          canvas.width,
          canvas.height,
          y,
          lineThreshold,
        );
      }
      const horizontalBandCandidates = _collapseLineBands(
        _lineBands(
          horizontalScores,
          Math.max(
            12,
            _maximumScore(horizontalScores) * 0.52,
          ),
          Math.max(9, Math.round(canvas.height * 0.008)),
        ),
        Math.max(8, canvas.height * 0.01),
      );
      // Bordas decorativas e ilustrações abaixo da tabela podem parecer linhas
      // válidas isoladamente. Mantemos a sequência tabular mais coesa; grades
      // consecutivas (por exemplo cadastro + itens) permanecem no mesmo bloco.
      const horizontalBands = _selectDenseLineSequence(
        horizontalBandCandidates,
        canvas.height,
      );
      // Linhas verticais são avaliadas somente na faixa da tabela. Isso inclui
      // grades menores dentro da página e exclui desenhos/rodapés que antes
      // criavam colunas fantasma por atravessarem outra região do documento.
      const verticalScanTop = horizontalBands.length >= 2
        ? Math.max(0, Math.floor(horizontalBands[0].center))
        : 0;
      const verticalScanBottom = horizontalBands.length >= 2
        ? Math.min(canvas.height - 1, Math.ceil(horizontalBands.at(-1).center))
        : canvas.height - 1;
      for (let x = 0; x < canvas.width; x++) {
        verticalScores[x] = _longestVerticalDarkRun(
          gray,
          canvas.width,
          canvas.height,
          x,
          lineThreshold,
          verticalScanTop,
          verticalScanBottom,
        );
      }
      const verticalBands = _collapseLineBands(
        _lineBands(
          verticalScores,
          Math.max(
            12,
            _maximumScore(verticalScores) * 0.50,
          ),
          Math.max(9, Math.round(canvas.width * 0.008)),
        ),
        Math.max(8, canvas.width * 0.006),
      );
      const horizontalLines = horizontalBands.map((band) => band.center);
      const verticalLines = verticalBands.map((band) => band.center);
      const hasGrid = _isUsableGrid(
        gray,
        canvas.width,
        canvas.height,
        horizontalLines,
        verticalLines,
        lineThreshold,
      );
      const rowSegments = hasGrid
        ? _detectRowSegments(
            gray,
            canvas.width,
            canvas.height,
            horizontalLines,
            verticalLines,
            lineThreshold,
          )
        : null;

      const horizontalMask = new Uint8Array(canvas.height);
      const verticalMask = new Uint8Array(canvas.width);
      if (hasGrid) {
        for (const band of horizontalBands) {
          for (
            let y = Math.max(0, band.start - 2);
            y <= Math.min(canvas.height - 1, band.end + 2);
            y++
          ) {
            horizontalMask[y] = 1;
          }
        }
        for (const band of verticalBands) {
          for (
            let x = Math.max(0, band.start - 2);
            x <= Math.min(canvas.width - 1, band.end + 2);
            x++
          ) {
            verticalMask[x] = 1;
          }
        }
      }

      for (let y = 0; y < canvas.height; y++) {
        const rowOffset = y * canvas.width;
        for (let x = 0; x < canvas.width; x++) {
          const index = rowOffset + x;
          const offset = index * 4;
          let value = ((gray[index] - low) * 255) / (high - low);
          value = _clamp(Math.round((value - 208) * 1.12 + 208), 0, 255);
          if (horizontalMask[y] || verticalMask[x]) value = 255;
          pixels.data[offset] = value;
          pixels.data[offset + 1] = value;
          pixels.data[offset + 2] = value;
          pixels.data[offset + 3] = 255;
        }
      }
      context.putImageData(pixels, 0, 0);

      return {
        canvas,
        dataUrl: canvas.toDataURL("image/png"),
        grid: hasGrid
          ? {
              horizontalLines,
              verticalLines,
              rowSegments,
              numericStartColumn: _findNumericStartColumn(verticalLines),
            }
          : null,
      };
    }

    function _normalizeTesseractWord(word) {
      const box = word && (word.bbox || word.boundingBox);
      const text = String((word && word.text) || "").trim();
      if (!box || !text) return null;
      const x0 = Number(box.x0);
      const y0 = Number(box.y0);
      const x1 = Number(box.x1);
      const y1 = Number(box.y1);
      if (![x0, y0, x1, y1].every(Number.isFinite) || x1 <= x0 || y1 <= y0) return null;
      return {
        text,
        x0,
        y0,
        x1,
        y1,
        confidence: _clamp(Number(word.confidence || word.conf || 70), 0, 100),
      };
    }

    function _groupGeneralWords(words, grid) {
      if (!grid) return words;
      const grouped = new Map();
      for (const word of words) {
        const centerX = (word.x0 + word.x1) / 2;
        const centerY = (word.y0 + word.y1) / 2;
        const detectedColumn = _cellIndex(grid.verticalLines, centerX);
        const row = _cellIndex(grid.horizontalLines, centerY);
        if (detectedColumn < 0 || row < 0) continue;
        const segment = _segmentForCell(grid, row, detectedColumn);
        const column = segment.start;
        // Mantemos também a primeira leitura das células numéricas; o passe
        // dedicado abaixo só a substitui quando entrega um candidato melhor.
        const key = `${row}:${column}`;
        if (!grouped.has(key)) {
          grouped.set(key, {
            row,
            column,
            columnSpan: segment.end - segment.start + 1,
            words: [],
          });
        }
        grouped.get(key).words.push(word);
      }

      const cells = [];
      for (const group of grouped.values()) {
        group.words.sort((a, b) => a.y0 - b.y0 || a.x0 - b.x0);
        const left = grid.verticalLines[group.column] + 2;
        const rowTop = grid.horizontalLines[group.row] + 2;
        const rowBottom = grid.horizontalLines[group.row + 1] - 2;
        const top = _clamp(
          Math.min(...group.words.map((word) => word.y0)),
          rowTop,
          Math.max(rowTop, rowBottom - 1),
        );
        const bottom = _clamp(
          Math.max(...group.words.map((word) => word.y1)),
          top + 1,
          Math.max(top + 1, rowBottom),
        );
        const separator = Math.max(12, (bottom - top) * 0.85);
        const observedRight = Math.max(...group.words.map((word) => word.x1));
        const right = Math.min(
          grid.verticalLines[group.column + group.columnSpan] - separator,
          Math.max(left + 1, observedRight),
        );
        cells.push({
          row: group.row,
          column: group.column,
          text: group.words.map((word) => word.text).join(" "),
          x0: left,
          y0: top,
          x1: Math.max(left + 1, right),
          y1: bottom,
          confidence: Math.min(...group.words.map((word) => word.confidence)),
          columnSpan: group.columnSpan,
        });
      }
      return cells;
    }

    async function _recognizeNumericRows(worker, prepared) {
      const grid = prepared.grid;
      if (!grid) return [];

      await worker.setParameters({
        tessedit_pageseg_mode: "7",
        tessedit_char_whitelist: "0123456789.,-/",
        classify_bln_numeric_mode: "1",
        preserve_interword_spaces: "1",
      });

      const numericCells = new Map();
      const firstX = grid.verticalLines[grid.numericStartColumn];
      const lastX = grid.verticalLines[grid.verticalLines.length - 1];
      const rowCount = grid.horizontalLines.length - 1;

      for (let row = 1; row < rowCount; row++) {
        const firstY = grid.horizontalLines[row];
        const lastY = grid.horizontalLines[row + 1];
        const padding = Math.max(2, Math.min(7, Math.round((lastY - firstY) * 0.07)));
        const sourceX = Math.max(0, Math.round(firstX + padding));
        const sourceY = Math.max(0, Math.round(firstY + padding));
        const sourceWidth = Math.min(
          prepared.canvas.width - sourceX,
          Math.max(1, Math.round(lastX - firstX - padding * 2)),
        );
        const sourceHeight = Math.min(
          prepared.canvas.height - sourceY,
          Math.max(1, Math.round(lastY - firstY - padding * 2)),
        );
        if (sourceWidth < 20 || sourceHeight < 8) continue;

        const scale = _clamp(150 / sourceHeight, 1.6, 3.2);
        const rowCanvas = document.createElement("canvas");
        rowCanvas.width = Math.max(1, Math.round(sourceWidth * scale));
        rowCanvas.height = Math.max(1, Math.round(sourceHeight * scale));
        const rowContext = rowCanvas.getContext("2d");
        rowContext.fillStyle = "#FFFFFF";
        rowContext.fillRect(0, 0, rowCanvas.width, rowCanvas.height);
        rowContext.imageSmoothingEnabled = true;
        rowContext.imageSmoothingQuality = "high";
        rowContext.drawImage(
          prepared.canvas,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          0,
          0,
          rowCanvas.width,
          rowCanvas.height,
        );

        const result = await worker.recognize(rowCanvas.toDataURL("image/png"));
        const rowWords = (result.data.words || [])
          .map(_normalizeTesseractWord)
          .filter(Boolean);
        let accepted = 0;

        for (const word of rowWords) {
          const pieces = word.text.match(/[0-9]+(?:[.,][0-9]+)?/g) || [];
          if (pieces.length === 0) continue;
          const absoluteCenterX = sourceX + ((word.x0 + word.x1) / 2) / scale;
          let column = _cellIndex(grid.verticalLines, absoluteCenterX);
          if (column < grid.numericStartColumn) column = grid.numericStartColumn;
          for (const piece of pieces) {
            if (column >= grid.verticalLines.length - 1) break;
            const key = `${row}:${column}`;
            if (!numericCells.has(key)) numericCells.set(key, { row, column, values: [], confidence: 100 });
            const cell = numericCells.get(key);
            cell.values.push(piece);
            cell.confidence = Math.min(cell.confidence, word.confidence);
            column++;
            accepted++;
          }
        }

        // Alguns builds retornam somente texto para PSM 7. Só distribuímos o
        // fallback quando a quantidade bate exatamente com a região numérica;
        // isso evita deslocar P para PP quando células iniciais estão vazias.
        if (accepted === 0) {
          const values = String(result.data.text || "").match(/[0-9]+(?:[.,][0-9]+)?/g) || [];
          const expectedCount = grid.verticalLines.length - 1 - grid.numericStartColumn;
          if (values.length !== expectedCount) continue;
          for (let index = 0; index < expectedCount; index++) {
            const column = grid.numericStartColumn + index;
            numericCells.set(`${row}:${column}`, {
              row,
              column,
              values: [values[index]],
              confidence: Number(result.data.confidence || 60),
            });
          }
        }
      }

      return Array.from(numericCells.values()).map((cell) => {
        const left = grid.verticalLines[cell.column] + 2;
        const rowTop = grid.horizontalLines[cell.row] + 2;
        const rowBottom = grid.horizontalLines[cell.row + 1] - 2;
        const textHeight = Math.max(8, (rowBottom - rowTop) * 0.52);
        const rowCenter = (rowTop + rowBottom) / 2;
        const top = rowCenter - textHeight / 2;
        const bottom = rowCenter + textHeight / 2;
        const separator = Math.max(12, textHeight * 0.85);
        const right = grid.verticalLines[cell.column + 1] - separator;
        return {
          row: cell.row,
          column: cell.column,
          text: cell.values.join(""),
          x0: left,
          y0: top,
          x1: Math.max(left + 1, right),
          y1: Math.max(top + 1, bottom),
          confidence: _clamp(cell.confidence, 0, 100),
        };
      });
    }

    function _numericText(value) {
      const normalized = String(value || "")
        .replace(/[oO]/g, "0")
        .replace(/[lI|]/g, "1")
        .replace(/\s+/g, "");
      const match = normalized.match(/^-?\d+(?:[.,/\-]\d+)*%?$/);
      if (!match) return "";
      const numeric = match[0];
      if (numeric.includes(",") && numeric.includes(".")) {
        return numeric.replaceAll(".", "");
      }
      if ((numeric.match(/\./g) || []).length === 1) {
        return numeric.replace(".", ",");
      }
      return numeric;
    }

    function _structuredGridWords(generalCells, numericCells, grid) {
      const generalByCell = new Map(
        generalCells.map((cell) => [`${cell.row}:${cell.column}`, cell]),
      );
      const numericByCell = new Map(
        numericCells.map((cell) => [`${cell.row}:${cell.column}`, cell]),
      );
      const words = [];
      const rowCount = grid.horizontalLines.length - 1;
      const columnCount = grid.verticalLines.length - 1;

      for (let row = 0; row < rowCount; row++) {
        for (let column = 0; column < columnCount; column++) {
          const key = `${row}:${column}`;
          const general = generalByCell.get(key);
          const numeric = numericByCell.get(key);
          let selected = general;

          if (row > 0 && column >= grid.numericStartColumn) {
            const numericValue = _numericText(numeric && numeric.text);
            const generalValue = _numericText(general && general.text);
            if (numericValue && (!generalValue || numeric.confidence >= general.confidence)) {
              selected = { ...numeric, text: numericValue };
            } else if (generalValue) {
              selected = { ...general, text: generalValue };
            } else {
              // Em tabelas genéricas, colunas depois de QTD/VALOR ainda podem
              // conter códigos, observações ou texto. Nunca apagamos a leitura
              // geral só porque o passe numérico não se aplica àquela célula.
              selected = general;
            }
          }

          const left = grid.verticalLines[column] + 2;
          const right = Math.max(left + 1, grid.verticalLines[column + 1] - 2);
          const top = grid.horizontalLines[row] + 2;
          const bottom = Math.max(top + 1, grid.horizontalLines[row + 1] - 2);
          words.push({
            text: selected && selected.text ? selected.text : "[[EXCELENCIA_EMPTY_CELL]]",
            x0: left,
            y0: top,
            x1: right,
            y1: bottom,
            confidence: selected ? selected.confidence : 100,
            columnSpan: selected ? selected.columnSpan || 1 : 1,
            isGridCell: true,
          });
        }
      }
      return words;
    }

    function _wordsToHocr(words) {
      const spans = words.map((word, index) => {
        const x0 = Math.round(word.x0);
        const y0 = Math.round(word.y0);
        const x1 = Math.max(x0 + 1, Math.round(word.x1));
        const y1 = Math.max(y0 + 1, Math.round(word.y1));
        const confidence = Math.round(_clamp(word.confidence, 0, 100));
        const columnSpan = Math.round(_clamp(Number(word.columnSpan || 1), 1, 16384));
        const gridFlag = word.isGridCell ? "; x_excelencia_grid 1" : "";
        return `<span class="ocrx_word" id="excelencia_word_${index}" title="bbox ${x0} ${y0} ${x1} ${y1}; x_wconf ${confidence}; x_excelencia_span ${columnSpan}${gridFlag}">${_escapeHocr(word.text)}</span>`;
      });
      return `<div class="ocr_page">${spans.join(" ")}</div>`;
    }

    async function _extractText(imagePath, mapData) {
      const worker = await Tesseract.createWorker();
      try {
        await worker.load();
        await worker.loadLanguage(mapData.language);
        await worker.initialize(mapData.language);
        await worker.setParameters(mapData.args || {});
        const prepared = await _prepareTableForOcr(imagePath);
        const result = await worker.recognize(prepared.dataUrl);
        if (!(mapData.args && mapData.args["tessjs_create_hocr"])) {
          return result.data.text;
        }

        const generalWords = (result.data.words || [])
          .map(_normalizeTesseractWord)
          .filter(Boolean);
        if (!prepared.grid) {
          return result.data.hocr || _wordsToHocr(generalWords);
        }
        prepared.grid.numericStartColumn = _inferNumericStartColumn(
          generalWords,
          prepared.grid,
        );
        const generalCells = generalWords.length === 0
          ? []
          : _groupGeneralWords(generalWords, prepared.grid);
        const numericCells = await _recognizeNumericRows(worker, prepared);
        return _wordsToHocr(
          _structuredGridWords(generalCells, numericCells, prepared.grid),
        );
      } finally {
        await worker.terminate();
      }
    }
  </script>

  <script src="flutter_bootstrap.js" defer></script>
